<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empalme del Huerva</title>
  <link rel="icon" type="image/png" href="./public/images/empalme-huerva-logo.png">
  <link rel="stylesheet" href="/src/styles/index.scss">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="header__nav">
      <a href="#plantilla" class="btn">
        Ir a Jugadores
      </a>
      <a href="#ultimo-resultado" class="btn">
        Último partido
      </a>
    </div>
    <div class="header__logo-container">
      <img src="/public/images/empalme-huerva-logo.png" alt="Escudo Empalme del Huerva" class="header__logo">
    </div>
  </header>

  <!-- Sección de información del club -->
  <section class="club-info">
    <div class="club-info__header">
      <p class="club-info__motto">"Un pueblo, una peña, un mismo escudo."</p>
    </div>

    <p class="club-info__description">
      Nacidos en María de Huerva, debutamos esta temporada 26-27 en el grupo 3 de 3ªB Domingo tarde (MLA Aragón)
    </p>
  </section>

  <!-- Grid de Jugadores -->
  <section id="plantilla" class="players-section">
    <h2 class="players-section__title">Nuestros jugadores...</h2>

    <div class="players-grid">
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/adahy.jpeg" alt="Adahy Alvarez">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/api.jpeg" alt="Daniel Pot">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/dario.jpeg" alt="Dario">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/elian.jpeg" alt="Elian Alfaro">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/marcos.jpeg" alt="Marcos Muñoz">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/narriz.jpeg" alt="Hugo Munarriz">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/pajaroto.jpeg" alt="Daniel Fernández">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/chino.jpeg" alt="Marcos Regaño">
      </a>
      <a href="/jugador.html" class="players-grid__card">
        <img class="players-grid__img" src="/images/players/rexus.jpeg" alt="Sergio Casado">
      </a>
    </div>
  </section>

  <!-- Último resultado -->
  <section id="ultimo-resultado" class="last-result">
    <h2 class="last-result__title">Último resultado</h2>

    <div class="last-result__card">
      <img 
        class="last-result__img"
        src="/images/results/last-result.jpeg" 
        alt="Resultado Jornada 3: Empalme del Huerva 1 - 3 Desmadre FC"
      >
    </div>
  </section>

</body>

</html>

</html>
